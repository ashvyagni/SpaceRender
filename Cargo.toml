[workspace]
resolver = "2"
members = [
    "crates/cosmogon_core",     # f64 math, constants, units, coordinate frames (no engine deps)
    "crates/cosmogon_physics",  # Kepler / orbital mechanics / integrators (no engine deps)
    "crates/cosmogon_sim",      # headless universe simulation: astronomy, life, civilizations, saves
    "crates/cosmogon_cli",      # headless runner for experiments, determinism checks and CI
    "crates/cosmogon",          # the desktop application (Bevy)
]
# legacy/ holds the original hand-written wgpu renderer; it is not built. See docs/ENGINE_ASSESSMENT.md.
exclude = ["legacy"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flamexmystix/cosmogon"
description = "Cosmogon — a living-universe simulator"

[workspace.dependencies]
cosmogon_core = { path = "crates/cosmogon_core" }
cosmogon_physics = { path = "crates/cosmogon_physics" }
cosmogon_sim = { path = "crates/cosmogon_sim" }

glam = { version = "0.29", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
num-traits = "0.2"
log = "0.4"

# The simulation is CPU-heavy even in debug builds; keep our own crates reasonably fast
# and dependencies fully optimized so `cargo run` is usable during development.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
