# Cosmogon technology graph.
#
# This is a *graph of causal prerequisites*, not a tree with timers. A technology becomes
# discoverable only when every condition in `requires` holds AND (if any `route`s are given)
# at least one route's conditions hold. Once discoverable, it is found by a Poisson process
# with mean `years`, accelerated by surplus knowledge, by the matching societal pressure
# (`demand`) and by the route's `speed`. Some technologies are never found on some worlds.
#
# Condition syntax:
#   tech:ID                    a known technology
#   k:Domain>=N                accumulated knowledge in a domain
#   res:KEY>=X                 planetary resource endowment relative to Earth (= 1.0)
#                              keys: iron copper tin coal oil uranium rare_metals fertile_land fresh_water
#   env:KEY>=X / env:KEY<=X    environment: oxygen gravity ocean land pressure temperature
#                              launch_dv (km/s to orbit) moons other_bodies
#   habitat:land|water         the species' native habitat
#   pop>=N                     population
#   flag:NAME                  a capability unlocked by another technology or event
#
# Knowledge domains: Mathematics Astronomy Physics Chemistry Biology Medicine Materials
#   Engineering Agriculture Navigation Computing Energy Communications
#
#   climate_stability (1 = stable interglacial)
#
# Effects: capacity (× carrying capacity), growth (+ yearly growth rate), research (× research
#   output), energy (W per person, raises the ceiling), fossil (share of energy from fossil
#   fuels, raises), fossil_cap (lowers), urban (+ target urbanisation), stability (+),
#   health (+ disease resistance), reach (+ expansion radius, radians per decade),
#   boost = { Domain = multiplier } (research focus), unlocks = ["flag", ...]

