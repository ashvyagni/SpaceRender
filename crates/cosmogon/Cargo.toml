[package]
name = "cosmogon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cosmogon — a living-universe simulator (desktop application)"
default-run = "cosmogon"

[[bin]]
name = "cosmogon"
path = "src/main.rs"

[dependencies]
cosmogon_sim = { workspace = true }
cosmogon_physics = { workspace = true }
bevy = { version = "0.18.1", features = ["3d", "default_font", "png", "tonemapping_luts", "zstd_rust"] }
bevy_egui = "0.39"
egui-phosphor = "0.11"
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
log = { workspace = true }

[build-dependencies]
winresource = "0.1"

[features]
default = []
# Faster incremental builds during development: `cargo run -p cosmogon --features dev`.
dev = ["bevy/dynamic_linking"]

[package.metadata.bundle]
name = "Cosmogon"
identifier = "org.cosmogon.app"
