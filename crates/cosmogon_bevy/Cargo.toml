[package]
name = "cosmogon_bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cosmogon universe simulator - Bevy implementation"

[dependencies]
bevy = { version = "0.18.0", features = ["3d", "ui", "default_font", "png", "tonemapping_luts", "zstd_rust"] }

big_space = { version = "0.12.0", features = ["camera", "debug"] }
glam = { version = "0.29", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rand_chacha = "0.3"
num-traits = "0.2"



[features]
default = ["bevy/dynamic_linking"]
dynamic_linking = ["bevy/dynamic_linking"]
